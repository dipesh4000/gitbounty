<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — GitBounty</title>
<meta name="description" content="Who has earned the most points on GitBounty, overall, this month and this week.">
<link rel="icon" type="image/svg" href="assets/logo_mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap app-wrap header-inner">
    <a class="brand" href="index.html" aria-label="GitBounty home">
      <img src="assets/logo_mark.svg" alt="" class="brand-mark">
      <span class="brand-name">GitBounty</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a href="leaderboard.html" aria-current="page">Leaderboard</a>
      <a href="points.html">Your points</a>
    </nav>


    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile">
    <a href="leaderboard.html">Leaderboard</a>
    <a href="points.html">Your points</a>
  </nav>
</header>

<main id="main" class="app-main">
  <div class="wrap app-wrap">

    <div class="page-head">
      <h1>Leaderboard</h1>
      <p>Points come from the issues people fix. A maintainer decides what an issue is worth, and whoever merges
         the fix earns it.</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <span class="control-label" id="period-label">Time</span>
        <div class="segmented" id="period-control" role="group" aria-labelledby="period-label"></div>
      </div>
      <div class="control-group">
        <span class="control-label" id="category-label">Kind of work</span>
        <div class="filter-pills" id="category-control" role="group" aria-labelledby="category-label"></div>
      </div>
    </div>

    <!-- Filled by app.js. aria-live so screen readers are told when the board changes. -->
    <div id="leaderboard-root" aria-live="polite" aria-busy="true"></div>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
