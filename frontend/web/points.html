<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your points — GitBounty</title>
<meta name="description" content="Your GitBounty points, where they came from, and the pull requests that earned them.">
<link rel="icon" type="image/svg" href="assets/logo_mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap app-wrap header-inner">
    <a class="brand" href="home.html" aria-label="GitBounty home">
      <img src="assets/logo_mark.svg" alt="" class="brand-mark">
      <span class="brand-name">GitBounty</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a href="leaderboard.html">Leaderboard</a>
      <a href="points.html" aria-current="page">Your points</a>
    </nav>


    <!-- Filled by app.js: either a sign-in button or who you are. -->
    <div class="account" id="account-slot"></div>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile">
    <a href="leaderboard.html">Leaderboard</a>
    <a href="points.html">Your points</a>
  </nav>
</header>

<main id="main" class="app-main">
  <div class="wrap app-wrap">

    <div class="page-head">
      <h1>Your points</h1>
      <p>Every merged pull request earns a little. One that closes an issue a maintainer put points on earns
         those too.</p>
    </div>

    <div class="sync-bar">
      <button class="btn btn-primary" id="sync-button" type="button">Sync with GitHub</button>
      <span class="sync-result" id="sync-result" role="status" aria-live="polite"></span>
    </div>

    <!-- Filled by app.js. -->
    <div id="points-root" aria-live="polite" aria-busy="true"></div>

  </div>
</main>

<footer class="app-footer">
  <div class="wrap app-wrap app-footer-inner">
    <span>GitBounty — built for CodeSlayer 2K26.</span>
    <span>&copy; <span id="year"></span></span>
  </div>
</footer>

<script src="auth-stub.js"></script>
<script src="app.js"></script>
</body>
</html>
