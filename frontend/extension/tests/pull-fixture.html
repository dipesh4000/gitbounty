<!doctype html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pull request · GitBounty extension fixture</title>
    <link rel="stylesheet" href="/styles/content.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(920px, calc(100% - 40px)); margin: 64px auto; }
      .repo { margin-bottom: 22px; color: #8b949e; font-family: ui-monospace, monospace; }
      .gh-header { padding-bottom: 18px; border-bottom: 1px solid #30363d; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
      .gh-header-meta { color: #8b949e; }
      .comment-body { margin-top: 26px; padding: 20px; border: 1px solid #30363d; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <div class="repo">openframe/core · PR #1910</div>
      <header class="gh-header">
        <h1>fix(palette): trap focus and loop arrow keys</h1>
        <div class="gh-header-meta">maya-dev wants to merge 3 commits into main</div>
      </header>
      <article class="comment-body">Improves command palette keyboard support. Closes #1842.</article>
    </main>
    <script>
      history.replaceState({}, "", "/openframe/core/pull/1910");
      window.fetch = async () => ({
        ok: true,
        text: async () => '<a href="/openframe/core/labels/gitbounty%3A40">gitbounty:40</a>',
      });
    </script>
    <script src="/src/points.js"></script>
    <script src="/src/content.js"></script>
  </body>
</html>
