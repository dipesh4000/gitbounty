<!doctype html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitBounty extension fixture</title>
    <link rel="stylesheet" href="/styles/content.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(920px, calc(100% - 40px)); margin: 64px auto; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
      header { padding: 16px; border-bottom: 1px solid #30363d; font-size: 26px; font-weight: 600; }
      .issue { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 14px 16px; border-bottom: 1px solid #21262d; }
      .issue:last-child { border-bottom: 0; }
      .state { color: #3fb950; font-size: 16px; }
      .title { color: #e6edf3; font-size: 16px; font-weight: 600; text-decoration: none; }
      .meta { margin-top: 5px; color: #8b949e; font-size: 12px; }
      .label { display: inline-flex; align-items: center; min-height: 22px; margin-top: 7px; padding: 0 7px; border: 1px solid #3d444d; border-radius: 999px; color: #e6edf3; font-size: 12px; text-decoration: none; }
      @media (max-width: 560px) { main { width: calc(100% - 20px); margin: 20px auto; } }
    </style>
  </head>
  <body>
    <main>
      <header>Issues</header>
      <article class="issue" data-testid="issue-row">
        <span class="state">●</span>
        <div>
          <a class="title" href="/openframe/core/issues/1842">Improve keyboard navigation in the command palette</a>
          <div><a class="label" href="/openframe/core/labels/gitbounty%3A40">gitbounty:40</a></div>
          <div class="meta">#1842 opened 2 hours ago by maya-dev</div>
        </div>
      </article>
      <article class="issue" data-testid="issue-row">
        <span class="state">●</span>
        <div>
          <a class="title" href="/openframe/core/issues/1857">Typed events for plugin lifecycle hooks</a>
          <div><a class="label" href="/openframe/core/labels/backend">backend</a></div>
          <div class="meta">#1857 opened 4 days ago by lin-rui</div>
        </div>
      </article>
      <article class="issue" data-testid="issue-row">
        <span class="state">●</span>
        <div>
          <a class="title" href="/openframe/core/issues/1850">Theme switcher flickers on first paint</a>
          <div class="meta">#1850 opened yesterday by sol-dev</div>
        </div>
      </article>
    </main>
    <script>history.replaceState({}, "", "/openframe/core/issues");</script>
    <script src="/src/points.js"></script>
    <script src="/src/content.js"></script>
  </body>
</html>
